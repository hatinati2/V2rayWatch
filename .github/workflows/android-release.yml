name: Android 0.2.2 release

on:
  push:
    tags:
      - "v0.2.2"

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Test, build, and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests and build debug APK
        working-directory: AndroidApp
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Stage APK and checksum
        run: |
          mkdir -p release-assets
          cp AndroidApp/app/build/outputs/apk/debug/app-debug.apk release-assets/V2rayWatch-Android-0.2.2-debug-preview.apk
          cd release-assets
          sha256sum V2rayWatch-Android-0.2.2-debug-preview.apk > V2rayWatch-Android-0.2.2-debug-preview.apk.sha256

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.2
          name: V2rayWatch Android 0.2.2
          draft: false
          prerelease: true
          generate_release_notes: false
          make_latest: false
          body: |
            ## V2rayWatch Android 0.2.2 — experimental preview

            - Adds a per-profile 20-check uptime history strip.
            - Green = successful real outbound check; red = failed check; gray = no recorded result.
            - The newest 20 automatic monitoring results are stored with the encrypted profile data and survive app restarts.
            - Manual one-off tests do not change the uptime history.
            - Existing profiles/settings from 0.2.1 are retained; history starts recording after installing 0.2.2 and running continuous monitoring.

            **This is a debug-signed sideload preview, not a Google Play release.** This Android app monitors proxy profiles; it is not a full-device VPN/TUN client. Build and unit tests run in GitHub Actions, but real-device and battery-policy testing are still required.

            The APK uses the standard CI debug signing configuration. Android may reject an in-place update if the signing certificate differs from a previously installed CI APK; do not uninstall an existing installation unless you have exported or otherwise preserved the profiles you need.
          files: |
            release-assets/V2rayWatch-Android-0.2.2-debug-preview.apk
            release-assets/V2rayWatch-Android-0.2.2-debug-preview.apk.sha256
          fail_on_unmatched_files: true