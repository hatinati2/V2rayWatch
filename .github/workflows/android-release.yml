name: Android signed release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  publish-android-release:
    name: Build, verify, and publish Android release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Validate Android version and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' AndroidApp/app/build.gradle.kts | head -n 1)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' AndroidApp/app/build.gradle.kts | head -n 1)"
          if [[ ! "$GITHUB_REF_NAME" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an Android-only tag such as android-v0.2.3."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "android-v${version_name}" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Android versionName $version_name."
            exit 1
          fi
          if [[ -z "$version_code" ]]; then
            echo "::error::Android versionCode could not be read."
            exit 1
          fi
          echo "ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare persistent Android signing keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          key_dir="$RUNNER_TEMP/v2raywatch-signing"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_dir/upload-keystore.jks"
          chmod 600 "$key_dir/upload-keystore.jks"
          echo "ANDROID_SIGNING_STORE_FILE=$key_dir/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Run tests and build signed release APK
        working-directory: AndroidApp
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:verifyAndroidReleaseSigning :app:assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk="AndroidApp/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"

      - name: Prepare release assets and SHA-256 checksum
        run: |
          set -euo pipefail
          mkdir -p release-assets
          asset="V2rayWatch-Android-${ANDROID_VERSION_NAME}-release.apk"
          cp AndroidApp/app/build/outputs/apk/release/app-release.apk "release-assets/$asset"
          cd release-assets
          sha256sum "$asset" > "V2rayWatch-Android-${ANDROID_VERSION_NAME}-SHA256SUMS.txt"

      - name: Publish Android-only GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: V2rayWatch Android ${{ steps.version.outputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            ## V2rayWatch Android ${{ steps.version.outputs.version_name }}

            - Signed Android APK built from the tagged source using the repository's persistent Android upload key.
            - Android version code: ${{ steps.version.outputs.version_code }}.
            - Android component release; this is separate from the existing multi-platform release and does not replace the `v0.2.3` tag or release.
            - Verify the SHA-256 checksum before installing.
            - This APK is a sideload build and is not a Google Play release.
          files: |
            release-assets/V2rayWatch-Android-${{ steps.version.outputs.version_name }}-release.apk
            release-assets/V2rayWatch-Android-${{ steps.version.outputs.version_name }}-SHA256SUMS.txt
