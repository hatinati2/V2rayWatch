name: Extract Android source (temporary)

on:
  push:
    paths:
      - ".github/workflows/extract-android-source.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source archive into AndroidApp
        shell: bash
        run: |
          set -euo pipefail
          if [ -d AndroidApp ]; then
            echo "AndroidApp already exists; nothing to extract."
            exit 0
          fi
          unzip -q V2rayWatch-project-0.2.1.zip
          test -d LinkWatchAndroid
          mkdir -p AndroidApp
          rsync -a --exclude='.git/' --exclude='.github/' LinkWatchAndroid/ AndroidApp/
          test -f AndroidApp/settings.gradle || test -f AndroidApp/settings.gradle.kts
          test -d AndroidApp/app

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AndroidApp
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit."
            exit 0
          fi
          git commit -m "build(android): extract 0.2.1 source for feature work"
          git push