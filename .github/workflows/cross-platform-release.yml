name: V2rayWatch Cross-Platform Release

on:
  push:
    branches:
      - main
      - "release-trigger/**"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: v2raywatch-cross-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/release-trigger/') || contains(github.event.head_commit.message, 'bootstrap-combined-release-v0.3.0') || contains(github.event.head_commit.message, 'release-linux-v0.3.2')
    name: Build and sign Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Validate shared release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            commit_message="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")"
            if [[ "$commit_message" == *"release-linux-v0.3.2"* ]]; then
              release_version="0.3.2"
            else
              release_version="0.3.0"
            fi
          elif [[ "$GITHUB_REF" == refs/heads/release-trigger/* ]]; then
            release_ref="${GITHUB_REF#refs/heads/release-trigger/}"
            if [[ ! "$release_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Expected a release trigger branch ending in a tag such as release-trigger/v0.3.1."
              exit 1
            fi
            release_version="${release_ref#v}"
          else
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Expected a shared release tag such as v0.3.1."
              exit 1
            fi
            release_version="${GITHUB_REF_NAME#v}"
          fi
          app_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' AndroidApp/app/build.gradle.kts | head -n 1)"
          if [[ "$app_version" != "$release_version" ]]; then
            echo "::error::Android versionName $app_version does not match release tag $release_version."
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare persistent Android signing keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          key_dir="$RUNNER_TEMP/v2raywatch-signing"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_dir/upload-keystore.jks"
          chmod 600 "$key_dir/upload-keystore.jks"
          echo "ANDROID_SIGNING_STORE_FILE=$key_dir/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Run Android unit tests and build signed release APK
        working-directory: AndroidApp
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:verifyAndroidReleaseSigning :app:assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk="AndroidApp/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"

      - name: Prepare Android release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk_name="V2rayWatch-Android-${RELEASE_VERSION}-release.apk"
          cp AndroidApp/app/build/outputs/apk/release/app-release.apk "release-assets/$apk_name"
          cd release-assets
          sha256sum "$apk_name" > "V2rayWatch-Android-${RELEASE_VERSION}-SHA256SUMS.txt"

      - name: Upload Android release assets
        uses: actions/upload-artifact@v4
        with:
          name: V2rayWatch-Android-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/release-trigger/') || contains(github.event.head_commit.message, 'bootstrap-combined-release-v0.3.0') || contains(github.event.head_commit.message, 'release-linux-v0.3.2')
    name: Build and test Windows Portable
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Validate shared release version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -eq "refs/heads/main") {
            $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            if ([string]$event.head_commit.message -like "*release-linux-v0.3.2*") {
              $releaseVersion = "0.3.2"
            } else {
              $releaseVersion = "0.3.0"
            }
          } elseif ($env:GITHUB_REF.StartsWith("refs/heads/release-trigger/")) {
            $releaseRef = $env:GITHUB_REF.Substring("refs/heads/release-trigger/".Length)
            if ($releaseRef -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Expected a release trigger branch ending in a tag such as release-trigger/v0.3.1."
            }
            $releaseVersion = $releaseRef.Substring(1)
          } else {
            if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Expected a shared release tag such as v0.3.1."
            }
            $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          }
          [xml]$project = Get-Content "Windows/DesktopPrototype/V2rayWatch.DesktopPrototype.csproj"
          $appVersion = [string]($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($appVersion -ne $releaseVersion) {
            throw "Windows project Version $appVersion does not match release tag $releaseVersion."
          }
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build standalone WPF application
        shell: pwsh
        run: |
          dotnet build Windows/DesktopPrototype/V2rayWatch.DesktopPrototype.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Standalone WPF build failed." }

      - name: Publish portable self-contained application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish Windows/DesktopPrototype/V2rayWatch.DesktopPrototype.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -o "$env:GITHUB_WORKSPACE\publish"
          if ($LASTEXITCODE -ne 0) { throw "Standalone Windows publish failed." }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\publish\V2rayWatch.exe")) {
            throw "V2rayWatch.exe was not created."
          }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\publish\licenses" | Out-Null
          Copy-Item "Windows\THIRD_PARTY_NOTICES_STANDALONE.md" "$env:GITHUB_WORKSPACE\publish\THIRD_PARTY_NOTICES.md" -Force
          Copy-Item "Windows\README-standalone.fa.md" "$env:GITHUB_WORKSPACE\publish\README-fa.md" -Force
          Copy-Item "Windows\README-standalone.en.md" "$env:GITHUB_WORKSPACE\publish\README-en.md" -Force

      - name: Download and verify official Xray Core
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $coreVersion = "v26.10.31"
          $coreName = "Xray-windows-64"
          $coreZip = "$env:RUNNER_TEMP\$coreName.zip"
          $expanded = "$env:RUNNER_TEMP\official-xray"
          $releaseBase = "https://github.com/XTLS/Xray-core/releases/download/$coreVersion"
          $expectedHash = "2e04a9995a6f2ad1b28c0bb25c708ecb2695e43a1c9c7889c4b6ac2b48cf7a6a"
          Invoke-WebRequest -Uri "$releaseBase/$coreName.zip" -OutFile $coreZip
          $actualHash = (Get-FileHash -LiteralPath $coreZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Official Xray ZIP SHA-256 verification failed. Expected $expectedHash, got $actualHash."
          }
          Expand-Archive -LiteralPath $coreZip -DestinationPath $expanded -Force
          $xray = Get-ChildItem -LiteralPath $expanded -Filter "xray.exe" -File -Recurse | Select-Object -First 1
          if ($null -eq $xray) { throw "Official Xray archive did not contain xray.exe." }
          $publishCore = "$env:GITHUB_WORKSPACE\publish\core"
          New-Item -ItemType Directory -Force -Path $publishCore | Out-Null
          Copy-Item $xray.FullName (Join-Path $publishCore "xray.exe") -Force
          foreach ($geo in @("geoip.dat", "geosite.dat")) {
            $source = Get-ChildItem -LiteralPath $expanded -Filter $geo -File -Recurse | Select-Object -First 1
            if ($null -ne $source) { Copy-Item $source.FullName (Join-Path $publishCore $geo) -Force }
          }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/XTLS/Xray-core/$coreVersion/LICENSE" -OutFile "$publishCore\CORE-LICENSE.txt"
          & (Join-Path $publishCore "xray.exe") version
          if ($LASTEXITCODE -ne 0) { throw "Official Xray Core failed its version smoke test." }

      - name: Run parser tests and validate generated Xray configurations
        shell: pwsh
        run: |
          $env:V2RAYWATCH_XRAY_PATH = "$env:GITHUB_WORKSPACE\publish\core\xray.exe"
          dotnet run --project Windows/DesktopPrototype.Tests/V2rayWatch.DesktopPrototype.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Parser or official Xray validation failed." }

      - name: Package Windows ZIP and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $asset = "V2rayWatch-Windows-${env:RELEASE_VERSION}-win-x64.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\*" -DestinationPath "$env:GITHUB_WORKSPACE\$asset" -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath "$env:GITHUB_WORKSPACE\$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Path "$env:GITHUB_WORKSPACE\V2rayWatch-Windows-${env:RELEASE_VERSION}-SHA256SUMS.txt" -Encoding utf8
          Write-Host "SHA-256: $hash"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: V2rayWatch-Windows-release-assets
          path: |
            V2rayWatch-Windows-${{ env.RELEASE_VERSION }}-win-x64.zip
            V2rayWatch-Windows-${{ env.RELEASE_VERSION }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  build-linux:
    if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/release-trigger/') || contains(github.event.head_commit.message, 'bootstrap-combined-release-v0.3.0') || contains(github.event.head_commit.message, 'release-linux-v0.3.2')
    name: Build and test Linux Server (Ubuntu ${{ matrix.ubuntu-version }})
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: ["24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Validate Linux Server release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            commit_message="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")"
            if [[ "$commit_message" == *"release-linux-v0.3.2"* ]]; then
              release_version="0.3.2"
            else
              release_version="0.3.0"
            fi
          elif [[ "$GITHUB_REF" == refs/heads/release-trigger/* ]]; then
            release_ref="${GITHUB_REF#refs/heads/release-trigger/}"
            release_version="${release_ref#v}"
          else
            release_version="${GITHUB_REF_NAME#v}"
          fi
          server_version="$(sed -nE 's/.*<Version>([^<]+)<\/Version>.*/\1/p' Server/src/V2rayWatch.Server.Web/V2rayWatch.Server.Web.csproj | head -n 1)"
          if [[ "$server_version" != "$release_version" ]]; then
            echo "::error::Linux Server version $server_version does not match release tag $release_version."
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Validate Linux scripts, dashboard JavaScript and shared icon
        shell: bash
        run: |
          set -euo pipefail
          bash -n Server/scripts/bootstrap-install.sh Server/scripts/install-ubuntu.sh Server/scripts/update-ubuntu.sh Server/scripts/publish-linux.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          web = Path("Server/src/V2rayWatch.Server.Web/wwwroot")
          ET.parse(web / "favicon.svg")
          for name in ("index.html", "login.html"):
              html = (web / name).read_text(encoding="utf-8")
              if 'href="./favicon.svg"' not in html or 'src="./favicon.svg"' not in html:
                  raise SystemExit(f"Shared favicon is not linked from {name}")
              scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {name}")
              Path(f"/tmp/{name}.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/index.html.js
          node --check /tmp/login.html.js

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore, build and test Linux Server
        run: |
          dotnet restore Server/V2rayWatch.Server.sln
          dotnet build Server/V2rayWatch.Server.sln --configuration Release --no-restore
          dotnet test Server/V2rayWatch.Server.sln --configuration Release --no-build

      - name: Package Linux Server source and checksum
        if: matrix.ubuntu-version == '24.04'
        shell: bash
        run: |
          set -euo pipefail
          asset="V2rayWatch-Linux-Server-${RELEASE_VERSION}-source.tar.gz"
          tar -czf "$asset" Server/
          sha256sum "$asset" > "V2rayWatch-Linux-Server-${RELEASE_VERSION}-SHA256SUMS.txt"

      - name: Upload Linux Server release assets
        if: matrix.ubuntu-version == '24.04'
        uses: actions/upload-artifact@v4
        with:
          name: V2rayWatch-Linux-Server-release-assets
          path: |
            V2rayWatch-Linux-Server-${{ env.RELEASE_VERSION }}-source.tar.gz
            V2rayWatch-Linux-Server-${{ env.RELEASE_VERSION }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/release-trigger/') || contains(github.event.head_commit.message, 'bootstrap-combined-release-v0.3.0') || contains(github.event.head_commit.message, 'release-linux-v0.3.2')
    name: Publish one combined Android + Windows + Linux Server Release
    needs:
      - build-android
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Determine combined release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            commit_message="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")"
            if [[ "$commit_message" == *"release-linux-v0.3.2"* ]]; then
              release_tag="v0.3.2"
              release_version="0.3.2"
            else
              release_tag="v0.3.0"
              release_version="0.3.0"
            fi
          elif [[ "$GITHUB_REF" == refs/heads/release-trigger/* ]]; then
            release_tag="${GITHUB_REF#refs/heads/release-trigger/}"
            release_version="${release_tag#v}"
          else
            release_tag="$GITHUB_REF_NAME"
            release_version="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Download Android release assets
        uses: actions/download-artifact@v4
        with:
          name: V2rayWatch-Android-release-assets
          path: release-assets

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: V2rayWatch-Windows-release-assets
          path: release-assets

      - name: Download Linux Server release assets
        uses: actions/download-artifact@v4
        with:
          name: V2rayWatch-Linux-Server-release-assets
          path: release-assets

      - name: Create combined SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cat release-assets/V2rayWatch-Android-*-SHA256SUMS.txt release-assets/V2rayWatch-Windows-*-SHA256SUMS.txt release-assets/V2rayWatch-Linux-Server-*-SHA256SUMS.txt > "release-assets/V2rayWatch-${{ steps.release.outputs.version }}-SHA256SUMS.txt"

      - name: Point v0.3.2 tag at the fully tested release source
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release-linux-v0.3.2')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "tags/v0.3.2",
              sha: context.sha,
              force: true
            });

      - name: Publish combined GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: main
          name: V2rayWatch ${{ steps.release.outputs.tag }} — Android + Windows + Linux Server
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            ## V2rayWatch ${{ steps.release.outputs.tag }} — Android + Windows + Linux Server

            این انتشار، نسخهٔ مشترک هر دو پلتفرم است. از این پس هر Release رسمی با یک تگ مشترک ساخته می‌شود و انتشار مستقل Android یا Windows انجام نخواهد شد.

            ### فایل‌های دریافت
            - Android: فایل APK امضاشده با کلید پایدار پروژه؛ قابل نصب به‌روزرسانی روی نسخه قبلی. این APK برای نصب مستقیم است و انتشار Google Play نیست.
            - Windows: بستهٔ Portable مستقل برای Windows 10/11 x64؛ ZIP را استخراج کنید و V2rayWatch.exe را اجرا کنید.
            - Linux Server: بستهٔ سورس و اسکریپت‌های نصب Native برای Ubuntu 24.04/26.04 روی x86_64 و ARM64؛ نصب‌کننده نسخهٔ تگ‌شده را دریافت و روی سرور build می‌کند.

            نصب تازه Linux:
            `curl -fsSL https://raw.githubusercontent.com/hatinati2/V2rayWatch/v0.3.2/Server/scripts/bootstrap-install.sh | sudo bash`

            به‌روزرسانی نصب موجود:
            `curl -fsSL https://raw.githubusercontent.com/hatinati2/V2rayWatch/v0.3.2/Server/scripts/update-ubuntu.sh | sudo bash`

            ### نسخه اجزای برنامه
            - Android versionName مطابق تگ مشترک و versionCode افزایش‌یافته است.
            - Windows نسخه مستقل WPF است و به v2rayN وابسته نیست.

            ### قابلیت‌های این نسخه
            - نوار تاریخچهٔ کوتاه‌مدت هر پروفایل در هر دو پلتفرم، شامل ۵۰ بررسی خودکار اخیر.
            - تاریخچهٔ بلندمدت ۲۴ساعته و ۷روزه با نمودار، نرخ موفقیت، تعداد شکست‌ها و آمار تأخیر؛ داده‌ها محلی نگهداری می‌شوند.
            - Android: رابط فشرده‌تر و بازطراحی‌شده، تم روشن/تیرهٔ هماهنگ با سیستم و ادامهٔ پایش با صفحهٔ خاموش از طریق Foreground Service و Partial Wake Lock زمان‌دار.
            - پشتیبان رمزگذاری‌شده بین Android، Windows و Linux با فرمت مشترک V2VWBAK1؛ فایل پشتیبان با همان عبارت عبور در هر سه پلتفرم قابل بازیابی است.
            - بازیابی غیرمخرب: پروفایل‌های موجود حفظ و لینک‌های تکراری رد می‌شوند.
            - نمایش و ذخیره QR پروفایل در Windows و واردکردن لینک با خواندن QR از فایل تصویر.
            - تنظیمات هشدار قطع و بازیابی در Windows قابل ذخیره و انتقال‌اند.
            - Linux: پنل وب با پایش systemd در پس‌زمینه، هشدار Gmail برای قطع/بازیابی، مدیریت Subscription، QR و بکاپ رمزگذاری‌شده. هویت بصری داشبورد و صفحه ورود با آیکون Android و Windows یکسان است.

            ### نکات
            - Windows System Proxy و TUN را تغییر نمی‌دهد.
            - امضای APK با کلید دائمی Android انجام می‌شود؛ فایل اجرایی Windows هنوز امضای کد ناشر ندارد.
            - پایش Windows فقط تا زمان باز بودن برنامه (از جمله System Tray) اجرا می‌شود.
            - QR شامل اطلاعات ورود پروکسی است؛ فایل/تصویر آن را خصوصی به اشتراک بگذارید.
            - پنل Linux فقط HTTP است؛ فایروال را فقط برای IPهای مورد اعتماد باز کنید. ایمیل Gmail از SMTP STARTTLS خروجی روی پورت 587 استفاده می‌کند و پورت ورودی جدیدی باز نمی‌کند.
            - فایل manifest شامل SHA-256 هر سه بسته است.

            ### روند انتشار
            برای انتشار بعدی، نسخهٔ Android، Windows و Linux Server را هماهنگ افزایش دهید و یک تگ نسخهٔ مشترک بسازید. همین workflow هر سه پلتفرم را تست و در یک Release پایدار منتشر می‌کند.
          files: |
            release-assets/*
