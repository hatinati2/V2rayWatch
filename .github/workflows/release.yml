name: V2rayWatch release

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "Windows/**"
      - ".github/workflows/release.yml"
      - "V2rayWatch-project-0.2.1.zip"
      - "AndroidApp/**"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 client
    runs-on: windows-latest
    steps:
      - name: Checkout V2rayWatch
        uses: actions/checkout@v4

      - name: Checkout upstream v2rayN source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 7.25.6 --recurse-submodules https://github.com/2dust/v2rayN.git upstream
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch pinned upstream v2rayN source." }

      - name: Rebrand and localize
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Windows\rebrand.ps1" -SourceRoot "$env:GITHUB_WORKSPACE\upstream"

      - name: Apply integrated V2rayWatch dashboard and monitoring
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Windows\apply-dashboard.ps1" -SourceRoot "$env:GITHUB_WORKSPACE\upstream"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish V2rayWatch.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish "./upstream/v2rayN/v2rayN/v2rayN.csproj" -c Release -r win-x64 -p:SelfContained=true -p:EnableWindowsTargeting=true -o "$env:GITHUB_WORKSPACE\publish"
          if ($LASTEXITCODE -ne 0) { throw "Windows application publish failed." }

          dotnet publish "./upstream/v2rayN/AmazTool/AmazTool.csproj" -c Release -r win-x64 -p:SelfContained=true -p:PublishTrimmed=true -p:EnableWindowsTargeting=true -o "$env:GITHUB_WORKSPACE\publish"
          if ($LASTEXITCODE -ne 0) { throw "AmazTool publish failed." }

      - name: Add pinned Xray and sing-box cores
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $coreZip = "$env:RUNNER_TEMP\v2rayN-windows-64-core-bin.zip"
          $expanded = "$env:RUNNER_TEMP\core-bin"
          $coreUrl = "https://raw.githubusercontent.com/2dust/v2rayN-core-bin/43271eebef5772c94eccc56746261e5193e7a65c/v2rayN-windows-64.zip"
          Invoke-WebRequest -Uri $coreUrl -OutFile $coreZip
          Expand-Archive -LiteralPath $coreZip -DestinationPath $expanded -Force

          $binSource = Join-Path $expanded "v2rayN-windows-64\bin"
          if (-not (Test-Path $binSource)) { throw "Pinned core package has no expected bin directory." }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\publish\bin" | Out-Null
          Copy-Item -Path "$binSource\*" -Destination "$env:GITHUB_WORKSPACE\publish\bin" -Recurse -Force

          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\publish\licenses" | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/2dust/v2rayN-core-bin/43271eebef5772c94eccc56746261e5193e7a65c/LICENSE" -OutFile "$env:GITHUB_WORKSPACE\publish\licenses\CORE-BIN-GPL-3.0.txt"
          Copy-Item "$env:GITHUB_WORKSPACE\upstream\LICENSE" "$env:GITHUB_WORKSPACE\publish\licenses\V2RAYN-GPL-3.0.txt" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\Windows\THIRD_PARTY_NOTICES.md" "$env:GITHUB_WORKSPACE\publish\THIRD_PARTY_NOTICES.md" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\Windows\README.fa.md" "$env:GITHUB_WORKSPACE\publish\README-fa.md" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\Windows\README.en.md" "$env:GITHUB_WORKSPACE\publish\README-en.md" -Force

      - name: Package portable Windows x64 build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "$env:GITHUB_WORKSPACE\V2rayWatch-Windows-x64.zip"
          if (Test-Path $package) { Remove-Item $package -Force }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\publish\V2rayWatch.exe")) { throw "V2rayWatch.exe missing from publish output." }
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\*" -DestinationPath $package -CompressionLevel Optimal

          # Keep the upstream-compatible asset name so the in-app updater can locate this release.
          Copy-Item $package "$env:GITHUB_WORKSPACE\v2rayN-windows-64.zip" -Force

      - name: Package corresponding GPL source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourcePackage = "$env:RUNNER_TEMP\V2rayWatch-Windows-source"
          New-Item -ItemType Directory -Force -Path $sourcePackage | Out-Null
          robocopy "$env:GITHUB_WORKSPACE\upstream" "$sourcePackage\upstream" /E /XD .git bin obj /R:2 /W:1 /NFL /NDL /NJH /NJS
          $copyExitCode = $LASTEXITCODE
          Write-Host "Robocopy source staging exit code: $copyExitCode"
          if ($copyExitCode -gt 7) { throw "Failed to stage corresponding GPL source (robocopy exit code $copyExitCode)." }
          $global:LASTEXITCODE = 0
          New-Item -ItemType Directory -Force -Path "$sourcePackage\V2rayWatch-branding" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\Windows\rebrand.ps1" "$sourcePackage\V2rayWatch-branding\rebrand.ps1"
          Copy-Item "$env:GITHUB_WORKSPACE\Windows\apply-dashboard.ps1" "$sourcePackage\V2rayWatch-branding\apply-dashboard.ps1"
          Copy-Item "$env:GITHUB_WORKSPACE\Windows\DASHBOARD_IMPLEMENTATION.fa.md" "$sourcePackage\V2rayWatch-branding\DASHBOARD_IMPLEMENTATION.fa.md"
          Copy-Item "$env:GITHUB_WORKSPACE\Windows\README.fa.md" "$sourcePackage\V2rayWatch-branding\README.fa.md"
          Copy-Item "$env:GITHUB_WORKSPACE\Windows\README.en.md" "$sourcePackage\V2rayWatch-branding\README.en.md"
          Copy-Item "$env:GITHUB_WORKSPACE\Windows\THIRD_PARTY_NOTICES.md" "$sourcePackage\V2rayWatch-branding\THIRD_PARTY_NOTICES.md"
          Compress-Archive -Path "$sourcePackage\*" -DestinationPath "$env:GITHUB_WORKSPACE\V2rayWatch-Windows-source-GPL-3.0.zip" -CompressionLevel Optimal
          $hashLines = @()
          foreach ($assetName in @("V2rayWatch-Windows-x64.zip", "v2rayN-windows-64.zip", "V2rayWatch-Windows-source-GPL-3.0.zip")) {
            $hash = (Get-FileHash (Join-Path $env:GITHUB_WORKSPACE $assetName) -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashLines += "$hash  $assetName"
          }
          $hashLines | Set-Content -Path "$env:GITHUB_WORKSPACE\V2rayWatch-Windows-SHA256SUMS.txt" -Encoding utf8

      - name: Upload Windows package and source
        uses: actions/upload-artifact@v4
        with:
          name: V2rayWatch-Windows-build
          path: |
            V2rayWatch-Windows-x64.zip
            v2rayN-windows-64.zip
            V2rayWatch-Windows-source-GPL-3.0.zip
            V2rayWatch-Windows-SHA256SUMS.txt
          if-no-files-found: error

  build-android:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2rayWatch
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android unit tests and build debug APK
        working-directory: AndroidApp
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Stage Android preview APK
        run: |
          mkdir -p release
          cp AndroidApp/app/build/outputs/apk/debug/app-debug.apk release/V2rayWatch-Android-0.2.2-debug-preview.apk
          cd release
          sha256sum V2rayWatch-Android-0.2.2-debug-preview.apk > V2rayWatch-Android-0.2.2-debug-preview.apk.sha256

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: V2rayWatch-Android-preview
          path: |
            release/V2rayWatch-Android-0.2.2-debug-preview.apk
            release/V2rayWatch-Android-0.2.2-debug-preview.apk.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/release/android-')
    needs:
      - build-windows
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2rayWatch
        uses: actions/checkout@v4

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: V2rayWatch-Windows-build
          path: release-assets

      - name: Download Android preview
        uses: actions/download-artifact@v4
        with:
          name: V2rayWatch-Android-preview
          path: release-assets

      - name: Publish V2rayWatch release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.3
          name: V2rayWatch 0.2.3
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## V2rayWatch Windows 0.2.3

            - Bilingual Persian / English interface.
            - Windows x64 portable client based on upstream v2rayN 7.25.6 (GPL-3.0), with V2rayWatch branding.
            - Integrated V2rayWatch monitoring dashboard with independently scheduled per-profile outbound checks (1–99,999 seconds), failure thresholds, tray down/recovery alerts, and persistent 20-check uptime history.
            - Profile import and management, subscriptions and QR import, System Proxy, TUN, routing, Xray and sing-box cores.
            - The project owner confirmed this Windows build works on their Windows device. The binary is unsigned; SmartScreen may show an unknown-publisher warning.

            ## Android 0.2.2 preview (separate component version)

            The Android APK is a debug-signed preview of the monitoring app, not a full Android VPN/TUN client. It includes the per-profile 20-check uptime strip. Test on a physical device; this APK is not a Google Play build.

            ## Licensing

            The Windows application is derived from 2dust/v2rayN 7.25.6 and distributed under GPL-3.0. The corresponding modified upstream source and V2rayWatch rebrand/dashboard scripts are included as V2rayWatch-Windows-source-GPL-3.0.zip. Third-party notices and SHA-256 checksums are attached.
          files: |
            release-assets/V2rayWatch-Windows-x64.zip
            release-assets/v2rayN-windows-64.zip
            release-assets/V2rayWatch-Windows-source-GPL-3.0.zip
            release-assets/V2rayWatch-Android-0.2.2-debug-preview.apk
            release-assets/V2rayWatch-Android-0.2.2-debug-preview.apk.sha256
          fail_on_unmatched_files: true
          make_latest: true
