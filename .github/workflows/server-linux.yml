name: Linux Server Build
on:
  push:
    branches: [main, "feature/linux-server"]
    paths: ["Server/**", ".github/workflows/server-linux.yml"]
  pull_request:
    paths: ["Server/**", ".github/workflows/server-linux.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and test (Ubuntu ${{ matrix.ubuntu-version }})
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: ["24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate installer scripts, profile key and dashboard JavaScript
        shell: bash
        run: |
          set -euo pipefail
          bash -n Server/scripts/bootstrap-install.sh Server/scripts/install-ubuntu.sh Server/scripts/update-ubuntu.sh Server/scripts/publish-linux.sh
          profile_key="$(openssl rand -base64 32 | tr -d '\r\n')"
          test "$(printf '%s' "$profile_key" | base64 --decode | wc -c)" -eq 32
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path("Server/src/V2rayWatch.Server.Web/wwwroot")
          ET.parse(root / "favicon.svg")
          for name in ("index.html", "login.html"):
              html = (root / name).read_text(encoding="utf-8")
              if 'href="./favicon.svg"' not in html or 'src="./favicon.svg"' not in html:
                  raise SystemExit(f"Shared V2rayWatch icon is not linked from {name}")
              scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {name}")
              Path(f"/tmp/{name}.js").write_text("\\n".join(scripts), encoding="utf-8")
          project = ET.parse("Server/src/V2rayWatch.Server.Web/V2rayWatch.Server.Web.csproj").getroot()
          version = project.findtext("./PropertyGroup/Version")
          if version != "0.3.2":
              raise SystemExit(f"Expected Linux Server version 0.3.2, got {version}")
          PY
          node --check /tmp/index.html.js
          node --check /tmp/login.html.js
      - run: dotnet restore Server/V2rayWatch.Server.sln
      - run: dotnet build Server/V2rayWatch.Server.sln -c Release --no-restore
      - run: dotnet test Server/V2rayWatch.Server.sln -c Release --no-build
      - name: Validate Hysteria2 configs with Xray Core
        shell: bash
        run: |
          set -euo pipefail
          release="$(curl --fail --silent --show-error --location https://api.github.com/repos/XTLS/Xray-core/releases/latest)"
          asset_api_url="$(jq -r '.assets[] | select(.name == "Xray-linux-64.zip") | .url' <<< "$release" | head -n1)"
          url="$(jq -r '.assets[] | select(.name == "Xray-linux-64.zip") | .browser_download_url' <<< "$release" | head -n1)"
          digest="$(jq -r '.assets[] | select(.name == "Xray-linux-64.zip") | .digest // empty' <<< "$release" | head -n1)"
          test -n "$url"
          test -n "$asset_api_url"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          if ! curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 -H "User-Agent: V2rayWatch-CI" "$url" -o "$tmp/xray.zip"; then
            echo "Browser download URL failed; retrying through the official GitHub Release Asset API."
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: V2rayWatch-CI" \
              "$asset_api_url" -o "$tmp/xray.zip"
          fi
          echo "${digest#sha256:}  $tmp/xray.zip" | sha256sum --check --status
          unzip -q "$tmp/xray.zip" -d "$tmp"
          for config in Server/tests/V2rayWatch.Server.Core.Tests/Fixtures/hysteria2-*.json; do
            "$tmp/xray" run -test -config "$config"
          done
