name: Linux Server Build
on:
  push:
    branches: [main, "feature/linux-server"]
    paths: ["Server/**", ".github/workflows/server-linux.yml"]
  pull_request:
    paths: ["Server/**", ".github/workflows/server-linux.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Server/V2rayWatch.Server.sln
      - run: dotnet build Server/V2rayWatch.Server.sln -c Release --no-restore
      - run: dotnet test Server/V2rayWatch.Server.sln -c Release --no-build
