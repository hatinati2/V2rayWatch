<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2rayWatch · Sign in</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#0b1220;color:#e5edf8}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}main{width:min(100%,420px);padding:32px;background:#121d30;border:1px solid #263752;border-radius:18px}h1{margin:0 0 8px}p{color:#9fb0c8}label{display:block;margin:24px 0 8px}input,button{width:100%;padding:13px;border-radius:9px;font:inherit}input{color:inherit;background:#0b1220;border:1px solid #344763}button{margin-top:18px;border:0;background:#5b8def;font-weight:700;cursor:pointer}#error{min-height:22px;color:#ff9292}.mark{color:#82aaff;font-weight:700;font-size:12px;margin-bottom:18px}</style></head>
<body><main><div class="mark">V2RAYWATCH SERVER</div><h1>Sign in</h1><p>Enter the administrator password created during installation.</p>
<form id="form"><label for="password">Administrator password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button>Continue</button><div id="error" role="alert"></div></form></main>
<script>const form=document.getElementById('form'),err=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';const b=form.querySelector('button');b.disabled=true;try{const r=await fetch('./api/v1/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(!r.ok){err.textContent=r.status===429?'Too many attempts. Try again in five minutes.':'Invalid password.';return;}location.href='../';}catch{err.textContent='Unable to contact server.';}finally{b.disabled=false;}});</script></body></html>
