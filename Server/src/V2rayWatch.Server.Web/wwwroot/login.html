<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2rayWatch Server · Sign in</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1220;color:#e5edf8}*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
main{width:min(100%,420px);padding:32px;background:#121d30;border:1px solid #263752;border-radius:18px;box-shadow:0 24px 80px #0006}
h1{margin:0 0 8px;font-size:25px}p{color:#9fb0c8;line-height:1.55}label{display:block;margin:24px 0 8px;font-size:14px}
input{width:100%;padding:13px 14px;color:inherit;background:#0b1220;border:1px solid #344763;border-radius:9px;font:inherit}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#5b8def;color:#081222;font-weight:700;cursor:pointer}
#error{min-height:22px;color:#ff9292;font-size:13px}.mark{color:#82aaff;font-weight:700;letter-spacing:.08em;font-size:12px;margin-bottom:18px}
</style></head><body><main><div class="mark">V2RAYWATCH SERVER</div><h1>Sign in</h1>
<p>Enter the administrator password created during installation.</p>
<form id="form"><label for="password">Administrator password</label><input id="password" type="password" autocomplete="current-password" required autofocus>
<button type="submit">Continue</button><div id="error" role="alert"></div></form></main>
<script>
const form=document.getElementById('form'),errorBox=document.getElementById('error');
form.addEventListener('submit',async event=>{
 event.preventDefault();errorBox.textContent='';const button=form.querySelector('button');button.disabled=true;
 try{const response=await fetch('./api/v1/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});
 if(!response.ok){errorBox.textContent=response.status===429?'Too many attempts. Try again in five minutes.':'Invalid password.';return;}
 window.location.href='./';
 }catch{errorBox.textContent='Unable to contact the server.';}finally{button.disabled=false;}
});
</script></body></html>
